name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Install ldid
        run: brew install ldid || echo "brew ldid 不可用，将跳过伪签名"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          grep -m1 objectVersion AuroraMusic.xcodeproj/project.pbxproj
          xcodebuild -list -project AuroraMusic.xcodeproj

      - name: Build (device, no signing)
        working-directory: ios
        continue-on-error: true
        run: |
          # 关键：先 set +e，保证失败时也会把退出码写进 build.exit，
          # 不会在写标记文件之前就被 -e 掐掉。
          set +e
          set -o pipefail
          xcodebuild \
            -project AuroraMusic.xcodeproj \
            -scheme AuroraMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_ENTITLEMENTS="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee build.log
          code=$?
          set -e
          printf '%s' "$code" > build.exit
          echo "xcodebuild exit=$code"

      - name: Report compiler diagnostics
        if: always()
        working-directory: ios
        run: |
          {
            echo "## 编译诊断"
            echo
            echo '```'
            # -a：日志里有二进制字节，当作文本处理
            grep -aE "error:" build.log 2>/dev/null | sort -u | head -60 || echo "(无 error)"
            echo '```'
            echo
            echo "## 警告"
            echo
            echo '```'
            # 警告必须露出来。v1.5.3 之前的播放闪退，根因就是 musicInfo 里的
            # 字典字面量重复键——编译器警告了 4 次，但这份报告只在失败时看，
            # 于是从来没人看见。重复键在运行时会 trap 成 SIGTRAP。
            grep -aE "warning:" build.log 2>/dev/null | sort -u | head -80 || echo "(无 warning)"
            echo '```'
            echo
            echo "最后 20 行："
            echo '```'
            tr -d '\000' < build.log 2>/dev/null | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify MD5 implementation
        run: |
          set -uo pipefail
          # ios/Sources/Net/Digest.swift 里是自己实现的 MD5（绕开 CC_MD5 的弃用警告）。
          # 酷狗接口的 signature / key 和洛雪脚本都硬性依赖 MD5，
          # 一旦实现写错，签名会全部失效——而且不报错，只是所有请求被服务端拒绝。
          # 用 swiftc 跑 RFC 1321 标准测试向量把关。
          echo "swiftc: $(command -v swiftc || echo '未找到')"
          echo "swift version: $(swift --version 2>&1 | head -1)"
          {
            echo "### MD5 校验"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! swiftc -O scripts/VerifyMD5.swift -o /tmp/verify-md5 > /tmp/md5-build.log 2>&1; then
            echo "编译失败："
            cat /tmp/md5-build.log
            { echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/md5-build.log >> "$GITHUB_STEP_SUMMARY"
            cp /tmp/md5-build.log "$GITHUB_WORKSPACE/ios/md5-build.log" 2>/dev/null || true
            echo "::error::MD5 验证脚本编译失败"
            exit 1
          fi
          echo "编译通过"

          if ! /tmp/verify-md5 > /tmp/md5-run.log 2>&1; then
            echo "运行失败："
            cat /tmp/md5-run.log
            { echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/md5-run.log >> "$GITHUB_STEP_SUMMARY"
            # 拷进工作目录，Upload build log / Publish diagnostics 才能带上
            cp /tmp/md5-run.log "$GITHUB_WORKSPACE/ios/md5-run.log" 2>/dev/null || true
            echo "::error::MD5 验证未通过"
            exit 1
          fi
          cat /tmp/md5-run.log
          { echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/md5-run.log >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/md5-run.log "$GITHUB_WORKSPACE/ios/md5-run.log" 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ios/build.log
            ios/build.exit
            ios/md5-build.log
            ios/md5-run.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish diagnostics to ci branch
        if: always()
        # 诊断分支只是排查用的旁路产物，推送偶发失败不该把整个构建
        # 连带 IPA 一起拦死（run #21 就是这么挂在打包之前的）。
        continue-on-error: true
        working-directory: ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG_BRANCH: ci/diagnostics-${{ github.run_number }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/diag
          tr -d '\000' < build.log > /tmp/diag/build.log 2>/dev/null || true
          cp build.exit /tmp/diag/build.exit 2>/dev/null || true
          # MD5 校验的输出也一并带上：它失败时 job 日志需要认证才能看，
          # 只有落盘到这个分支才能在排查时看到真实报错。
          cp /tmp/md5-build.log /tmp/diag/md5-build.log 2>/dev/null || true
          cp /tmp/md5-run.log /tmp/diag/md5-run.log 2>/dev/null || true
          cd /tmp/diag
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$DIAG_BRANCH"
          git add -A
          git commit -q -m "ci: build log for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DIAG_BRANCH"
          echo "published to $DIAG_BRANCH"

      - name: Fail on compiler warnings
        working-directory: ios
        run: |
          set -uo pipefail
          # 有意为之：v1.5.3 之前的播放闪退，根因是 musicInfo 里的字典字面量
          # 出现了重复键。Swift 运行时对重复键的字典字面量直接 __builtin_trap，
          # 也就是 SIGTRAP；编译器会警告，但因为值不是常量所以只降级为警告。
          # 之前 CI 只在编译失败时才被人看，警告就这么一路溜过去。
          # 这里把警告升级为失败：看不见的问题就不再是问题。
          # 只看我们自己源码的警告：appintentsmetadataprocessor（AppIntents 元数据
          # 提取）会打自己的警告，与本项目代码无关，不能因此拦住构建。
          WARNINGS=$(grep -aE "warning:" build.log 2>/dev/null \
            | grep -v "appintentsmetadataprocessor" > /tmp/warns.txt || true)
          COUNT=$(wc -l < /tmp/warns.txt | tr -d ' ')
          echo "项目源码警告数：$COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::存在 $COUNT 条编译警告，构建终止。完整列表见上一步的诊断报告。"
            head -30 /tmp/warns.txt
            exit 1
          fi

      - name: Check build result
        working-directory: ios
        run: |
          set -uo pipefail
          APP="build/Build/Products/Release-iphoneos/AuroraMusic.app"
          {
            echo "### 打包前置检查"
            echo '```'
            echo "pwd        : $(pwd)"
            echo "build.exit : [$(cat build.exit 2>&1)]"
            echo "产物目录   : $(ls -d "$APP" 2>&1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 以产物为准，不依赖任何跨步骤的中间文件
          if [ -f "$APP/AuroraMusic" ]; then
            echo "产物就绪，开始打包"
          else
            echo "::error::没有可打包的产物（xcodebuild exit=$(cat build.exit 2>/dev/null || echo 未知)）"
            exit 1
          fi

      - name: Verify bundled sources made it into the app
        working-directory: ios
        run: |
          set -uo pipefail
          APP="build/Build/Products/Release-iphoneos/AuroraMusic.app"
          {
            echo "### 内置音源资源校验"
            echo '```'
            ls -la "$APP" 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 有意为之：仓库不再内置任何音源脚本（无 license 的脚本不能公开再分发），
          # CI 打出来的 IPA 不带音源，装好后需要手动导入 .js 音源文件。
          # 这里只做信息报告，零个 .js 是正常状态，不能让构建失败。
          # 之前曾强制要求至少一个 .js，那是为了防 XcodeGen 静默丢资源；
          # 现在「没有音源」是预期状态，改为：有 .js 就确认数量，没有就提示手动导入。
          if [ -d "$APP/BundledSources" ]; then
            COUNT=$(find "$APP/BundledSources" -name '*.js' | wc -l | tr -d ' ')
            echo "BundledSources 里有 $COUNT 个 .js"
            if [ "$COUNT" -eq 0 ]; then
              echo "::notice::IPA 不含内置音源（有意为之）。安装后请到「我的 → 第三方音源」手动导入音源脚本"
            fi
          else
            echo "::notice::.app 里没有 BundledSources 目录（project.yml 里标记 optional，可接受）"
          fi

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/AuroraMusic.app"
          test -d "$APP"
          rm -rf Payload "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # ldid 伪签名：越狱设备上用 AppSync/AppSyncUnified / Sileo 需伪签名才能装
          if command -v ldid >/dev/null 2>&1; then
            ldid -S"Payload/AuroraMusic.app" || echo "ldid pseudo-sign failed, continuing"
          fi
          zip -qry "AuroraMusic-$(git describe --tags --always 2>/dev/null || echo dev).ipa" Payload
          rm -rf Payload
          ls -lh *.ipa

      - name: Bundle ID / min iOS report
        working-directory: ios
        run: |
          {
            echo "## 构建信息"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- bundle id: com.aurora.music"
            echo "- min iOS: 16.0"
            echo "- 签名: 无（ldid 伪签名，供越狱设备安装）"
            echo
            echo "## 文件校验"
            echo '```'
            shasum -a 256 ./*.ipa || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraMusic-unsigned-ipa
          path: ios/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/*.ipa
          body: |
            越狱设备安装：下载 `.ipa` → 用 AppSync/Filza 打开 → 伪签名已处理，直接安装。
            永久签名可用 TrollStore 导入同包。
