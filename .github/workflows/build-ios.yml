name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Install ldid
        run: brew install ldid || echo "brew ldid 不可用，将跳过伪签名"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          grep -m1 objectVersion AuroraMusic.xcodeproj/project.pbxproj
          xcodebuild -list -project AuroraMusic.xcodeproj

      - name: Build (device, no signing)
        working-directory: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project AuroraMusic.xcodeproj \
            -scheme AuroraMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_ENTITLEMENTS="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee build.log
          # 结果写进独立标记文件：xcodebuild 的日志里混有二进制，
          # 拿 grep 去判断会被非法字节干扰。
          echo "${PIPESTATUS[0]}" > build.exit

      - name: Report compiler errors
        if: always()
        working-directory: ios
        run: |
          {
            echo "## 编译诊断"
            echo
            echo '```'
            # -a：日志里有二进制字节，当作文本处理
            grep -aE "(error|warning):" build.log 2>/dev/null | sort -u | head -60 || echo "(无 error/warning 行)"
            echo '```'
            echo
            echo "最后 20 行："
            echo '```'
            tr -d '\000' < build.log 2>/dev/null | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ios/build.log
            ios/build.exit
          if-no-files-found: warn
          retention-days: 14

      - name: Publish diagnostics to ci branch
        if: always()
        working-directory: ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG_BRANCH: ci/diagnostics-${{ github.run_number }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/diag
          tr -d '\000' < build.log > /tmp/diag/build.log 2>/dev/null || true
          cp build.exit /tmp/diag/build.exit 2>/dev/null || true
          cd /tmp/diag
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$DIAG_BRANCH"
          git add -A
          git commit -q -m "ci: build log for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DIAG_BRANCH"
          echo "published to $DIAG_BRANCH"

      - name: Check build result
        working-directory: ios
        run: |
          status="$(cat build.exit 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$status" = "0" ]; then
            echo "编译通过，开始打包"
          else
            echo "::error::编译失败 (xcodebuild exit=${status:-未知})，详见 build.log"
            exit 1
          fi

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/AuroraMusic.app"
          test -d "$APP"
          rm -rf Payload "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # ldid 伪签名：越狱设备上用 AppSync/AppSyncUnified / Sileo 需伪签名才能装
          if command -v ldid >/dev/null 2>&1; then
            ldid -S"Payload/AuroraMusic.app" || echo "ldid pseudo-sign failed, continuing"
          fi
          zip -qry "AuroraMusic-$(git describe --tags --always 2>/dev/null || echo dev).ipa" Payload
          rm -rf Payload
          ls -lh *.ipa

      - name: Bundle ID / min iOS report
        working-directory: ios
        run: |
          {
            echo "## 构建信息"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- bundle id: com.aurora.music"
            echo "- min iOS: 16.0"
            echo "- 签名: 无（ldid 伪签名，供越狱设备安装）"
            echo
            echo "## 文件校验"
            echo '```'
            shasum -a 256 ./*.ipa || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraMusic-unsigned-ipa
          path: ios/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/*.ipa
          body: |
            越狱设备安装：下载 `.ipa` → 用 AppSync/Filza 打开 → 伪签名已处理，直接安装。
            永久签名可用 TrollStore 导入同包。
