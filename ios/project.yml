name: AuroraMusic
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  objectVersion: "56"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "2.0.0"
  # 🔴 把 xctest-dynamic-overlay 锁到 1.7.0：它是 supabase-swift → Get 的传递依赖，
  # 其 1.8.0+ 要求 swift-tools-version 6.0、1.13.x 要求 6.4（需 Xcode 26），
  # 而本 CI 默认 Xcode 15.4（Swift 5.10）编译不了。1.7.0 是最后一个 5.9 版本、
  # 且自带 IssueReporting 无外部依赖，能在 Xcode 15.4 下正常编译。
  xctest-dynamic-overlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay.git
    exactVersion: "1.7.0"
targets:
  AuroraMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 内置音源脚本。必须写在 sources 里（配 buildPhase: resources）——
      # 之前放在顶层的 resources: 键里，XcodeGen 会静默忽略，
      # 结果 .app 里一个 .js 都没有，内置音源永远装不上。
      - path: BundledSources
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.music
        INFOPLIST_FILE: Sources/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
